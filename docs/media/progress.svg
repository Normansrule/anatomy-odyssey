  <g class="done"><rect x="358" y="64" width="164" height="38"/><circle cx="378" cy="83" r="6"/><text x="394" y="88">Respiratory</text></g>
  <g class="done"><rect x="532" y="64" width="164" height="38"/><circle cx="552" cy="83" r="6"/><text x="568" y="88">Nervous</text></g>
  <g class="done"><rect x="706" y="64" width="164" height="38"/><circle cx="726" cy="83" r="6"/><text x="742" y="88">Digestive</text></g>
  <g class="done"><rect x="10" y="112" width="164" height="38"/><circle cx="30" cy="131" r="6"/><text x="46" y="136">Urinary</text></g>
  <g class="done"><rect x="184" y="112" width="164" height="38"/><circle cx="204" cy="131" r="6"/><text x="220" y="136">Pancreas</text></g>
  <g class="done"><rect x="358" y="112" width="164" height="38"/><circle cx="378" cy="131" r="6"/><text x="394" y="136">Liver</text></g>
  <g class="part"><rect x="532" y="112" width="164" height="38"/><circle cx="552" cy="131" r="6"/><text x="568" y="136">Immune</text></g>
  <g class="part"><rect x="706" y="112" width="164" height="38"/><circle cx="726" cy="131" r="6"/><text x="742" y="136">Muscular</text></g>
  <g class="part"><rect x="10" y="160" width="164" height="38"/><circle cx="30" cy="179" r="6"/><text x="46" y="184">Skin</text></g>
  <g class="part"><rect x="184" y="160" width="164" height="38"/><circle cx="204" cy="179" r="6"/><text x="220" y="184">Smell</text></g>
