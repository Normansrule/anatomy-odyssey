<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -8 928 266" role="img" aria-labelledby="t d" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title id="t">Progress: real organs up close in 8 of 15 dives</title>
  <desc id="d">Done, with the real measured organ at the organ step: skeletal, circulatory, respiratory, nervous, digestive, urinary, pancreas, liver. Measured body but a drawn close-up: immune, muscular, skin, smell. Not possible from the atlas yet: endocrine, eye, ear.</desc>
  <style>
    .bg { fill: #eef0ea; }
    .head { fill: #1b2120; font-size: 20px; font-weight: 700; }
    .sub { fill: #4a5452; font-size: 15px; }
    text { font-size: 15px; }
    .done rect { fill: #f3dcdc; stroke: #a3242f; }
    .done circle { fill: #a3242f; }
    .done text { fill: #1b2120; }
    .part rect { fill: #e1e5de; stroke: #2b58a5; }
    .part circle { fill: none; stroke: #2b58a5; stroke-width: 2; }
    .part text { fill: #1b2120; }
    .todo rect { fill: none; stroke: #8a948f; stroke-dasharray: 4 4; }
    .todo circle { fill: none; stroke: #4a5452; stroke-width: 1.5; }
    .todo text { fill: #4a5452; }
    .legend { fill: #4a5452; font-size: 14px; }
  </style>
  <rect class="bg" x="-23" y="-7" width="926" height="264" stroke="#1b2120" stroke-width="2"/>
  <text class="head" x="10" y="36">8 of 15 dives have the real organ up close</text>
