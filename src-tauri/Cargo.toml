[package]
name = "anatomy-odyssey"
version = "0.11.0"
description = "A guided journey through the human body, from whole body to molecule."
authors = ["Aleksander Norman", "Claude (Anthropic)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "anatomy_odyssey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
