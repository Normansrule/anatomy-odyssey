<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>README art v4 · preview</title>
<style>
  /* preview only: every new README graphic at GitHub's widths, on white and on #0d1117 */
  body { margin: 0; font: 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .col { padding: 20px 28px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #e6edf3; }
  h2 { font-size: 13px; font-weight: 600; margin: 22px 0 6px; opacity: .7; }
  img { display: block; height: auto; }
  .w { width: 830px; max-width: 100%; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tiles img { width: 260px; }
</style>
</head>
<body>
<div class="cols"><div class="col light" id="L"></div><div class="col dark" id="D"></div></div>
<script>
  const M = "../../media/readme/";
  const sections = ["start-here", "fly", "explore", "ideas", "learn", "build", "compute", "observe", "credits"];
  const parts = [
    ["stats.svg", "w"],
    ...["orbit", "comet", "starfield"].map(d => [`dividers/${d}.svg`, "w"]),
    ...sections.map(s => [`sections/${s}.svg`, "w"]),
    ["tiles", "tiles"],
    ...["experiments", "simulations", "engineering", "equations"].map(s => [`sub/${s}.svg`, "w"]),
    ...["telescope-resolution", "transit", "redshift", "sunspot-rotation", "link-budget"].map(c => [`concepts/${c}.svg`, "w"]),
    ["concepts/wavelengths.svg", "w"],
  ];
  const html = parts.map(([src, cls]) => cls === "tiles"
    ? `<h2>tiles</h2><div class="tiles">${["solar-observatory", "surveys", "telescopes", "mission-designer", "moon", "dsn", "academy"].map(t => `<img src="${M}tiles/${t}.svg">`).join("")}</div>`
    : `<h2>${src}</h2><img class="${cls}" src="${M}${src}">`).join("");
  document.getElementById("L").innerHTML = "<h2>GitHub light (#ffffff)</h2>" + html;
  document.getElementById("D").innerHTML = "<h2>GitHub dark (#0d1117)</h2>" + html;
</script>
</body>
</html>
