<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Pull-string water rocket launcher (cable-tie release)</title>
  <rect width="900" height="500" rx="18" fill="#0b0f1c"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#e9edff">Pull-string launcher (cable-tie "Clark" release)</text>
  <text x="30" y="64" font-size="13" fill="#8f98bd">The rocket is held by a ring of cable ties hooked over the bottle's neck ring; sliding the collar down releases it</text>

  <!-- ground -->
  <rect x="0" y="440" width="900" height="60" rx="0" fill="#141a2c"/>
  <!-- base board -->
  <rect x="140" y="420" width="380" height="20" rx="3" fill="#6b4f2a"/>
  <text x="330" y="458" font-size="11" fill="#c3cae6" text-anchor="middle">plywood base, staked to the ground</text>
  <!-- PVC tee and pipe -->
  <rect x="300" y="380" width="60" height="40" rx="4" fill="#dfe6f2"/>
  <rect x="180" y="392" width="120" height="16" fill="#dfe6f2"/>
  <text x="240" y="385" font-size="11" fill="#c3cae6" text-anchor="middle">½-in PVC, Schedule 40</text>
  <!-- launch tube -->
  <rect x="320" y="215" width="20" height="165" fill="#dfe6f2"/>
  <rect x="315" y="232" width="30" height="6" rx="2" fill="#ff7a3d"/>
  <text x="200" y="239" font-size="11" fill="#ff7a3d" text-anchor="end">O-ring: the bottle mouth seals on it</text><path d="M204 235 H300" stroke="#ff7a3d" stroke-width="1"/>
  <!-- bottle (inverted) -->
  <path d="M312 232 L312 212 L300 212 L300 205 L360 205 L360 212 L348 212 L348 232 Z" fill="#7cc8ff" opacity="0.5"/>
  <path d="M312 205 L312 190 Q270 170 270 130 L270 90 L390 90 L390 130 Q390 170 348 190 L348 205 Z" fill="#7cc8ff" opacity="0.28" stroke="#7cc8ff"/>
  <rect x="270" y="90" width="120" height="0" />
  <text x="400" y="140" font-size="12" fill="#7cc8ff">2 L PET bottle, neck DOWN</text>
  <text x="400" y="156" font-size="11" fill="#c3cae6">⅓ water, air above</text>
  <!-- cable ties + collar -->
  <g stroke="#e9edff" stroke-width="3">
    <path d="M296 262 L302 214"/><path d="M364 262 L358 214"/>
  </g>
  <rect x="288" y="262" width="84" height="26" rx="4" fill="#b18cff" opacity="0.85"/>
  <text x="200" y="272" font-size="11" fill="#b18cff" text-anchor="end">sliding collar (¾-in PVC)</text><text x="200" y="286" font-size="11" fill="#b18cff" text-anchor="end">holds the tie ends closed</text>
  <text x="380" y="228" font-size="11" fill="#e9edff">cable-tie fingers grip the neck ring</text>
  <!-- pull string -->
  <path d="M372 276 Q520 300 650 400 L780 420" stroke="#ffc24b" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <circle cx="790" cy="420" r="10" fill="#ffc24b"/>
  <text x="870" y="470" font-size="12" fill="#ffc24b" text-anchor="end">pull string ≥ 5 m: operator stands here</text>
  <!-- air line -->
  <path d="M180 400 L90 400 L90 440" stroke="#4ef0b8" stroke-width="4" fill="none"/>
  <circle cx="90" cy="400" r="9" fill="#4ef0b8"/>
  <text x="30" y="366" font-size="11" fill="#4ef0b8">air hose ≥ 5 m to the pump,</text>
  <text x="30" y="380" font-size="11" fill="#4ef0b8">ball valve + tyre valve at far end</text>
  <rect x="40" y="440" width="36" height="0"/>
  <text x="30" y="480" font-size="11" fill="#c3cae6">bike pump WITH gauge · max 60 psi (414 kPa)</text>
  <!-- safety -->
  <rect x="600" y="92" width="270" height="118" rx="10" fill="#3b2410" stroke="#ff7a3d"/>
  <text x="614" y="116" font-size="13" font-weight="700" fill="#ff7a3d">Safety</text>
  <g font-size="11" fill="#e9edff">
    <text x="614" y="136">• eye protection for everyone</text>
    <text x="614" y="154">• never stand over or beside a loaded rocket</text>
    <text x="614" y="172">• pump from ≥ 5 m away through a long hose</text>
    <text x="614" y="190">• ≤ 60 psi, bottles retired after 10–15 flights</text>
  </g>
</svg>
