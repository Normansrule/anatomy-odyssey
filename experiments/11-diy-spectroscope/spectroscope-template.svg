<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4" font-family="Helvetica, Arial, sans-serif">
<title>DIY spectroscope net · Cosmic Codex</title>
<rect width="215.9" height="279.4" fill="#fff"/>
<style>
 .cut{fill:none;stroke:#111;stroke-width:0.35}
 .fold{fill:none;stroke:#1a6fd6;stroke-width:0.3;stroke-dasharray:2 1.2}
 .glue{fill:#ffe9b0;stroke:#111;stroke-width:0.35}
 .fill{fill:#eef5ff;stroke:#111;stroke-width:0.35}
 .win{fill:#fff;stroke:#d63a1a;stroke-width:0.4;stroke-dasharray:1 0.6}
 .t{font-size:3.2px;fill:#222} .h{font-size:6px;font-weight:700;fill:#111} .s{font-size:2.6px;fill:#555}
 .m{stroke:#d63a1a;stroke-width:0.4}
</style>
<text x="14" y="18" class="h">DIY spectroscope — printable net</text><text x="14" y="24" class="t">Cosmic Codex · experiments/11-diy-spectroscope · print on card stock, black side INSIDE (colour the inside black with a marker).</text><g transform="translate(14,256)"><rect x="0" y="0" width="50" height="4" fill="#111"/><line x1="0" y1="4" x2="0" y2="6" stroke="#111" stroke-width="0.3"/><line x1="10" y1="4" x2="10" y2="6" stroke="#111" stroke-width="0.3"/><line x1="20" y1="4" x2="20" y2="6" stroke="#111" stroke-width="0.3"/><line x1="30" y1="4" x2="30" y2="6" stroke="#111" stroke-width="0.3"/><line x1="40" y1="4" x2="40" y2="6" stroke="#111" stroke-width="0.3"/><line x1="50" y1="4" x2="50" y2="6" stroke="#111" stroke-width="0.3"/><text x="54" y="4" class="s">← this bar must measure exactly 50 mm: print at 100 % / “actual size”</text></g><rect class="fill" x="16" y="66" width="30" height="150"/><rect class="fill" x="46" y="66" width="30" height="150"/><line class="fold" x1="46" y1="66" x2="46" y2="216"/><rect class="fill" x="76" y="66" width="30" height="150"/><line class="fold" x1="76" y1="66" x2="76" y2="216"/><rect class="fill" x="106" y="66" width="30" height="150"/><line class="fold" x1="106" y1="66" x2="106" y2="216"/><polygon class="glue" points="136,69 144,72 144,210 136,213"/><line class="fold" x1="136" y1="66" x2="136" y2="216"/><rect class="fill" x="46" y="36" width="30" height="30"/><line class="fold" x1="46" y1="66" x2="76" y2="66"/><rect class="win" x="60.0" y="41" width="2" height="20"/><text x="64.0" y="52" class="s">SLIT</text><rect class="fill" x="46" y="216" width="30" height="30"/><line class="fold" x1="46" y1="216" x2="76" y2="216"/><rect class="win" x="53.5" y="223.5" width="15" height="15"/><text x="61.0" y="244" class="s" text-anchor="middle">GRATING</text><polygon class="glue" points="46,38 39,41 39,61 46,64"/><line class="fold" x1="46" y1="36" x2="46" y2="66"/><polygon class="glue" points="76,38 83,41 83,61 76,64"/><line class="fold" x1="76" y1="36" x2="76" y2="66"/><polygon class="glue" points="46,218 39,221 39,241 46,244"/><line class="fold" x1="46" y1="216" x2="46" y2="246"/><polygon class="glue" points="76,218 83,221 83,241 76,244"/><line class="fold" x1="76" y1="216" x2="76" y2="246"/><text x="31.0" y="141.0" class="t" text-anchor="middle" transform="rotate(-90 31.0 141.0)">side · 150 mm</text><text x="61.0" y="141.0" class="t" text-anchor="middle" transform="rotate(-90 61.0 141.0)">TOP · 150 mm</text><text x="91.0" y="141.0" class="t" text-anchor="middle" transform="rotate(-90 91.0 141.0)">side · 150 mm</text><text x="121.0" y="141.0" class="t" text-anchor="middle" transform="rotate(-90 121.0 141.0)">bottom · 150 mm</text><text x="152" y="74" class="t" font-weight="700">Camera wedges</text><text x="152" y="79" class="s">cut 2 of the one for your disc</text><polygon class="fill" points="152,96.37 186,96.37 152,84"/><text x="154" y="94.37" class="s">CD 20°</text><polygon class="fill" points="152,142.14 186,142.14 152,104.37498796505088"/><text x="154" y="140.14" class="s">DVD 48°</text><text x="152" y="156.14" class="s">GRATING: a piece of CD or DVD with the</text><text x="152" y="160.34" class="s">label and metal layer lifted off with tape</text><text x="152" y="164.54" class="s">(DVD: split the two plastic halves). Tape</text><text x="152" y="168.74" class="s">it over the window, tracks PARALLEL to</text><text x="152" y="172.94" class="s">the slit.</text><text x="152" y="177.14" class="s"></text><text x="152" y="181.34" class="s">SLIT: two razor-blade edges or strips of</text><text x="152" y="185.54" class="s">aluminium tape, 0.2–0.5 mm apart.</text><text x="152" y="189.74" class="s">Narrower = sharper lines, dimmer image.</text><text x="152" y="193.94" class="s"></text><text x="152" y="198.14" class="s">PHONE: glue a wedge on each side of the</text><text x="152" y="202.34" class="s">grating window, rest the phone on them,</text><text x="152" y="206.54" class="s">lens over the window. First order:</text><text x="152" y="210.74" class="s">sin θ = λ / d  (CD d = 1.6 µm → 20°;</text><text x="152" y="214.94" class="s">DVD d = 0.74 µm → 48°, at λ = 550 nm).</text><text x="152" y="219.14" class="s"></text><text x="152" y="223.34" class="s">Aim the SLIT at a fluorescent tube, a</text><text x="152" y="227.54" class="s">white cloud or sunlit paper.</text><text x="152" y="231.74" class="s">NEVER at the Sun.</text><text x="14" y="270" class="s">Legend:  black = cut   ·   blue dashes = fold   ·   yellow = glue   ·   red dotted = cut-out window.  CC0 — copy freely.</text></svg>
