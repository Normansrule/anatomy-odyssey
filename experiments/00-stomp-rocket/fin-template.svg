<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4" font-family="Helvetica, Arial, sans-serif">
<title>Stomp rocket fin, nose and wrap template · Cosmic Codex</title>
<rect width="215.9" height="279.4" fill="#fff"/>
<style>
 .cut{fill:none;stroke:#111;stroke-width:0.35}
 .fold{fill:none;stroke:#1a6fd6;stroke-width:0.3;stroke-dasharray:2 1.2}
 .glue{fill:#ffe9b0;stroke:#111;stroke-width:0.35}
 .fill{fill:#eef5ff;stroke:#111;stroke-width:0.35}
 .win{fill:#fff;stroke:#d63a1a;stroke-width:0.4;stroke-dasharray:1 0.6}
 .t{font-size:3.2px;fill:#222} .h{font-size:6px;font-weight:700;fill:#111} .s{font-size:2.6px;fill:#555}
 .m{stroke:#d63a1a;stroke-width:0.4}
</style>
<text x="14" y="18" class="h">Stomp rocket template</text><text x="14" y="24" class="t">Cosmic Codex · experiments/00-stomp-rocket · cut on black lines, fold on blue dashes, glue on yellow.</text><g transform="translate(14,256)"><rect x="0" y="0" width="50" height="4" fill="#111"/><line x1="0" y1="4" x2="0" y2="6" stroke="#111" stroke-width="0.3"/><line x1="10" y1="4" x2="10" y2="6" stroke="#111" stroke-width="0.3"/><line x1="20" y1="4" x2="20" y2="6" stroke="#111" stroke-width="0.3"/><line x1="30" y1="4" x2="30" y2="6" stroke="#111" stroke-width="0.3"/><line x1="40" y1="4" x2="40" y2="6" stroke="#111" stroke-width="0.3"/><line x1="50" y1="4" x2="50" y2="6" stroke="#111" stroke-width="0.3"/><text x="54" y="4" class="s">← this bar must measure exactly 50 mm: print at 100 % / “actual size”</text></g><polygon class="fill" points="24.00,36.00 64.00,71.00 64.00,96.00 24.00,96.00"/><polygon class="glue" points="24,36 16,40 16,92 24,96"/><line class="fold" x1="24" y1="36" x2="24" y2="96"/><text x="30" y="90" class="t">FIN 1</text><text x="20.0" y="66.0" class="s" transform="rotate(-90 20.0 66.0)" text-anchor="middle">glue tab</text><text x="27" y="45" class="s">↑ nose</text><polygon class="fill" points="72.00,36.00 112.00,71.00 112.00,96.00 72.00,96.00"/><polygon class="glue" points="72,36 64,40 64,92 72,96"/><line class="fold" x1="72" y1="36" x2="72" y2="96"/><text x="78" y="90" class="t">FIN 2</text><text x="68.0" y="66.0" class="s" transform="rotate(-90 68.0 66.0)" text-anchor="middle">glue tab</text><text x="75" y="45" class="s">↑ nose</text><polygon class="fill" points="120.00,36.00 160.00,71.00 160.00,96.00 120.00,96.00"/><polygon class="glue" points="120,36 112,40 112,92 120,96"/><line class="fold" x1="120" y1="36" x2="120" y2="96"/><text x="126" y="90" class="t">FIN 3</text><text x="116.0" y="66.0" class="s" transform="rotate(-90 116.0 66.0)" text-anchor="middle">glue tab</text><text x="123" y="45" class="s">↑ nose</text><polygon class="fill" points="168.00,36.00 208.00,71.00 208.00,96.00 168.00,96.00"/><polygon class="glue" points="168,36 160,40 160,92 168,96"/><line class="fold" x1="168" y1="36" x2="168" y2="96"/><text x="174" y="90" class="t">spare</text><text x="164.0" y="66.0" class="s" transform="rotate(-90 164.0 66.0)" text-anchor="middle">glue tab</text><text x="171" y="45" class="s">↑ nose</text><text x="14" y="112" class="s">Fins: root 60 mm · tip 25 mm · span 40 mm · sweep 35 mm. Card stock (≈ 200 g/m²) or a cereal box works best. Bend the glue tab 90° along the blue line.</text><rect class="cut" x="14" y="122" width="82.69" height="18"/><polygon class="glue" points="84.69,122 96.69,122 96.69,140 84.69,140"/><line class="m" x1="14.00" y1="122" x2="14.00" y2="131"/><text x="14.80" y="129" class="s">3-fin</text><line class="m" x1="37.56" y1="122" x2="37.56" y2="131"/><text x="38.36" y="129" class="s">3-fin</text><line class="m" x1="61.12" y1="122" x2="61.12" y2="131"/><text x="61.92" y="129" class="s">3-fin</text><line class="m" x1="84.69" y1="122" x2="84.69" y2="131"/><text x="85.49" y="129" class="s"></text><line x1="14.00" y1="131" x2="14.00" y2="140" stroke="#1a6fd6" stroke-width="0.4"/><text x="14.80" y="138" class="s">4-fin</text><line x1="31.67" y1="131" x2="31.67" y2="140" stroke="#1a6fd6" stroke-width="0.4"/><text x="32.47" y="138" class="s">4-fin</text><line x1="49.34" y1="131" x2="49.34" y2="140" stroke="#1a6fd6" stroke-width="0.4"/><text x="50.14" y="138" class="s">4-fin</text><line x1="67.01" y1="131" x2="67.01" y2="140" stroke="#1a6fd6" stroke-width="0.4"/><text x="67.81" y="138" class="s">4-fin</text><text x="102.69" y="128" class="t">Fin wrap guide</text><text x="102.69" y="133" class="s">Wrap around the tail of the body tube, tape the overlap,</text><text x="102.69" y="137" class="s">mark the tube at each red (3 fins) or blue (4 fins) line.</text><text x="102.69" y="141" class="s">Sized for paper rolled on ½-inch PVC (tube Ø ≈ 22.5 mm, C = 70.7 mm).</text><path class="fill" d="M60,160 L27.41,193.09 A46.45,46.45 0 0,0 92.59,193.09 Z"/><path class="glue" d="M60,160 L92.59,193.09 L95.66,183.54 Z"/><text x="60" y="187.87" class="t" text-anchor="middle">NOSE</text><text x="112" y="170" class="t">Nose cone</text><text x="112" y="176" class="s">Cut out the sector, curl it into a cone, glue the yellow tab under</text><text x="112" y="180" class="s">the opposite edge. Base Ø 23 mm, height 45 mm (sector angle 89.1°).</text><text x="112" y="184" class="s">Tape it over the closed end of the tube. Stuff a cotton ball in the tip</text><text x="112" y="188" class="s">(soft, and moves the centre of gravity forward = more stable).</text><text x="14" y="216" class="t" font-weight="700">Build summary</text><text x="14" y="222" class="s">1. Roll half a sheet of paper around ½-inch PVC, tape the seam along its length (tube ≈ 20 cm long).</text><text x="14" y="228" class="s">2. Slide the tube off, fold the top 2 cm flat and tape it airtight — the air must push, not leak.</text><text x="14" y="234" class="s">3. Add the nose cone over the sealed end and the fins at the open end using the wrap guide.</text><text x="14" y="240" class="s">4. Sight along the tube: fins must be straight, not twisted. Launch tube must slide in freely.</text><text x="14" y="246" class="s">5. Launch outdoors, aimed away from people, with everyone behind the launcher. Eye protection on.</text><text x="14" y="270" class="s">Legend:  black = cut   ·   blue dashes = fold   ·   yellow = glue   ·   red ticks = fin positions.  CC0 — copy freely.</text></svg>
