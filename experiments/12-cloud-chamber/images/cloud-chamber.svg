<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Diffusion cloud chamber cross-section</title>
  <defs>
    <linearGradient id="vap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff" stop-opacity="0.05"/>
      <stop offset="0.75" stop-color="#7cc8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7cc8ff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="860" height="470" rx="18" fill="#0b0f1c"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#e9edff">Diffusion cloud chamber (cross-section)</text>
  <text x="30" y="64" font-size="13" fill="#8f98bd">Warm alcohol vapour sinks toward the −78 °C plate and becomes supersaturated in a thin layer just above it</text>

  <!-- tank -->
  <rect x="160" y="100" width="420" height="250" rx="6" fill="url(#vap)" stroke="#c3cae6" stroke-width="2.5"/>
  <!-- felt -->
  <rect x="166" y="106" width="408" height="16" fill="#b18cff" opacity="0.85"/>
  <text x="600" y="114" font-size="12" fill="#b18cff">felt soaked in 99 % isopropyl</text><text x="600" y="130" font-size="12" fill="#b18cff">alcohol (room temperature)</text>
  <!-- falling vapour arrows -->
  <g stroke="#7cc8ff" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M230 140 v40 m-5 -8 l5 8 l5 -8"/><path d="M330 150 v40 m-5 -8 l5 8 l5 -8"/>
    <path d="M430 140 v40 m-5 -8 l5 8 l5 -8"/><path d="M520 150 v40 m-5 -8 l5 8 l5 -8"/>
  </g>
  <text x="600" y="176" font-size="12" fill="#7cc8ff">vapour diffuses down and cools</text>
  <!-- sensitive layer -->
  <rect x="163" y="292" width="414" height="34" fill="#7cc8ff" opacity="0.18"/>
  <text x="600" y="306" font-size="12" fill="#e9edff" font-weight="700">sensitive layer (≈ 1 cm)</text>
  <text x="600" y="322" font-size="11" fill="#c3cae6">supersaturated: droplets form on ion trails</text>
  <!-- tracks -->
  <path d="M190 296 L360 322" stroke="#ffffff" stroke-width="1.6" opacity="0.95"/>
  <text x="200" y="288" font-size="11" fill="#e9edff">muon: long, thin, straight</text>
  <path d="M420 316 q10 -10 18 -2 t16 -6 t14 4 t12 -8" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.9"/>
  <text x="395" y="288" font-size="11" fill="#e9edff">electron: curly</text>
  <path d="M520 318 l22 -8" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <text x="500" y="288" font-size="11" fill="#e9edff">alpha: short, fat</text>
  <!-- plate -->
  <rect x="150" y="350" width="440" height="12" fill="#2a2f3f" stroke="#8f98bd"/>
  <text x="600" y="360" font-size="12" fill="#c3cae6">black-painted metal plate (sheet pan)</text>
  <!-- dry ice -->
  <rect x="140" y="362" width="460" height="44" rx="6" fill="#e9edff" opacity="0.18" stroke="#e9edff" stroke-opacity="0.5"/>
  <g fill="#e9edff" opacity="0.6">
    <rect x="160" y="372" width="40" height="24" rx="4"/><rect x="215" y="370" width="46" height="28" rx="4"/><rect x="276" y="374" width="38" height="22" rx="4"/>
    <rect x="330" y="370" width="50" height="28" rx="4"/><rect x="396" y="373" width="42" height="24" rx="4"/><rect x="452" y="371" width="44" height="26" rx="4"/><rect x="512" y="374" width="40" height="22" rx="4"/>
  </g>
  <text x="615" y="386" font-size="12" fill="#e9edff" font-weight="700">dry ice, −78.5 °C</text>
  <text x="615" y="402" font-size="11" fill="#ff7a3d">gloves + ventilated room · never seal it in</text>
  <rect x="120" y="406" width="500" height="20" rx="4" fill="#3a2a78" opacity="0.6"/>
  <text x="370" y="421" font-size="11" fill="#e9edff" text-anchor="middle">insulating foam box</text>
  <!-- light -->
  <path d="M40 300 L160 312 L160 328 Z" fill="#ffc24b" opacity="0.35"/>
  <rect x="20" y="294" width="24" height="40" rx="4" fill="#ffc24b"/>
  <text x="18" y="354" font-size="11" fill="#ffc24b">LED torch,</text>
  <text x="18" y="368" font-size="11" fill="#ffc24b">side-on, low</text>
  <text x="30" y="452" font-size="11" fill="#8f98bd">Upside-down clear plastic or glass box · seal the bottom edge to the plate with a strip of tape or plasticine · dark room · look from above at a low angle</text>
</svg>
