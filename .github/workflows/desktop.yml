# Build desktop installers for Windows, macOS and Linux with Tauri, and attach
# them to a published GitHub release, which the web app and README link to
# (releases/latest). Runs when a version tag (v0.9.1, ...) is pushed,
# or by hand from the Actions tab. Every third-party action is pinned to a full
# commit hash; the comment names the release it corresponds to.
#
# The installers are not code-signed yet, so Windows SmartScreen and macOS
# Gatekeeper will warn on first launch. Each release lists SHA-256 checksums
# so downloads can be verified.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # to create the release and upload installers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Anatomy Odyssey ${{ github.ref_name }}'
          releaseBody: |
            Desktop installers for Windows, macOS and Linux. Prefer the browser? The web version is at https://normansrule.github.io/anatomy-odyssey/

            Which file to download:
            - Windows: the `.exe` installer (or the `.msi`)
            - macOS (Apple silicon and Intel): the `.dmg`
            - Linux: the `.AppImage`, or the `.deb` on Ubuntu and Debian

            The installers are not code-signed yet, so your system may warn on first launch. On Windows choose More info, then Run anyway. On macOS right-click the app, choose Open, then Open again. Verify downloads against SHA256SUMS (`sha256sum -c SHA256SUMS`).
          releaseDraft: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$REPO"
          sha256sum * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber
