<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="ttl dsc"><title id="ttl">Cosmic Library line map</title><desc id="dsc">A transit-style map of the Cosmic Library website. Four lines: FLY (orange): Saturn V launch, Booster landing, Moon landing, Mars landing, Endeavour, Rocket hangar, Rocket builder. EXPLORE (blue): Live Earth orbit, Night sky, Solar system, The Sun, Space weather, Black hole, Galaxy collision, Cosmic scale. LEARN (purple): Orbit Lab, Solar system, Equations, Timeline, Gallery, Documents. BUILD (green): Rocket builder, Experiments, Equations. Interchanges: Rocket builder (FLY/BUILD), Solar system (EXPLORE/LEARN), Equations (LEARN/BUILD). 'Start here' flags mark the Saturn V launch and the Orbit Lab. Small trains glide along each line. Station names are the page labels from the PAGES list in site/assets/js/codex.js.</desc><style>.s{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.smil,.still{}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}.flag{animation:bob 2.4s ease-in-out infinite}@keyframes bob{0%,100%{opacity:1}50%{opacity:.72}}</style><defs><linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#04050a"/></linearGradient><radialGradient id="cglow" cx=".15" cy="0" r=".9"><stop offset="0" stop-color="#b18cff" stop-opacity=".10"/><stop offset="1" stop-color="#b18cff" stop-opacity="0"/></radialGradient><clipPath id="cclip"><rect x="1" y="1" width="998" height="418" rx="15"/></clipPath></defs><rect x=".5" y=".5" width="999" height="419" rx="16" fill="url(#cbg)"/><rect x=".5" y=".5" width="999" height="419" rx="16" fill="url(#cglow)"/><g clip-path="url(#cclip)"><g fill="#dfe8ff"><circle cx="581.2" cy="81.8" r="1.04" opacity