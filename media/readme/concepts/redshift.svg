<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="ttl dsc"><title id="ttl">Redshift: spectral lines sliding red</title><desc id="dsc">Animated redshift diagram. A galaxy moves away from the observer and shrinks; its absorption lines (calcium H and K at 393.37 and 396.85 nm, hydrogen beta 486.13 nm, magnesium 517.27 nm, sodium D 589.29 nm, hydrogen alpha 656.28 nm; NIST) slide toward the red end of the spectrum compared with a laboratory spectrum, each by λ_rest × z. z = 0.025: v ≈ 7,495 km/s, d ≈ 107 Mpc, Hα at 672.7 nm; z = 0.05: v ≈ 14,990 km/s, d ≈ 214 Mpc, Hα at 689.1 nm; z = 0.075: v ≈ 22,484 km/s, d ≈ 321 Mpc, Hα at 705.5 nm; z = 0.1: v ≈ 29,979 km/s, d ≈ 428 Mpc, Hα at 721.9 nm. Speeds use v ≈ cz (c = 299,792.458 km/s) and distances Hubble's law d = v/H₀ with H₀ = 70 km/s/Mpc; both are good approximations only for small z (at z = 0.1 the errors are a few per cent). 1 Mpc = 3.26 million light-years.</desc><style>.s{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.smil,.still{}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}@keyframes gal{0%{transform:translate(130px,138px) scale(1);opacity:1}13.846%{transform:translate(130px,138px) scale(1);opacity:1}20%{transform:translate(185px,138px) scale(0.86);opacity:1}33.846%{transform:translate(185px,138px) scale(0.86);opacity:1}40%{transform:translate(240px,138px) scale(0.72);opacity:1}53.846%{transform:translate(240px,138px) scale(0.72);opacity:1}60%{transform:translate(295px,138px) scale(0.58);opacity:1}73.846%{transform:translate(295px,138px) scale(0.58);opacity:1}80%{transform:translate(350px,138px) scale(0.44);opacity:1}93.846%{transform:translate(350px,138px) scale(0.44);opacity:1}96.923%{transform:translate(405px,138px) scale(0.3);opacity:0}97.023%{tra