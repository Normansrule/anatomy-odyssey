<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="ttl dsc"><title id="ttl">How long light takes to reach the planets</title><desc id="dsc">Animated log-scale diagram: a pulse of light leaves the Sun and passes each planet; each planet's light-time appears as the pulse arrives. The animation is sped up and the distance axis is logarithmic. Light-time = mean distance (semi-major axis, NASA NSSDCA planetary fact sheets) ÷ c, c = 299,792.458 km/s: Mercury 57.9×10⁶ km → 3 min 13 s; Venus 108.2×10⁶ km → 6 min 01 s; Earth 149.6×10⁶ km → 8 min 19 s; Mars 228.0×10⁶ km → 12 min 41 s; Jupiter 778.5×10⁶ km → 43 min 17 s; Saturn 1,432.0×10⁶ km → 1 h 20 min; Uranus 2,867.0×10⁶ km → 2 h 39 min; Neptune 4,515.0×10⁶ km → 4 h 11 min. Earth at 1 AU = 149,597,870.7 km → 499.0 s = 8 min 19 s; Mars 12.7 min on average. Proxima Centauri is 4.24 light-years away. Earth → Moon: 384,400 km ÷ c = 1.28 s (round trip 2.56 s, as timed by lunar laser ranging); that dot moves in real time.</desc><style>.s{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.smil,.still{}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}.pulse{opacity:0}@keyframes pulse{0%{transform:translateX(58px);opacity:0}5%{transform:translateX(98px);opacity:1}80%{transform:translateX(958px);opacity:1}82%{transform:translateX(978px);opacity:0}100%{transform:translateX(978px);opacity:0}}.pulse{animation:pulse 12s linear infinite}@keyframes p0{0%{opacity:0}12.978%{opacity:0}13.978%{opacity:1}95%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.p0{animation:p0 12s linear infinite}@keyframes p1{0%{opacity:0}21.895%{opacity:0}22.895%{opacity:1}95%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.p1{animation:p1 12s linear infinite}@keyframes p2{0%{opacity:0}26.516%{opacity:0}27.516%{opaci