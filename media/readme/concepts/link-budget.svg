="13.5" fill="#ffc24b">flux 2.0 × 10⁻²¹ W per m²</text></g><g class="r4"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">r = 10.0 billion km  ·  9.3 h of travel</text><text x="28" y="312" class="m" font-size="13.5" fill="#ffc24b">flux 1.1 × 10⁻²¹ W per m²</text></g><g class="r5"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">r = 12.5 billion km  ·  11.6 h of travel</text><text x="28" y="312" class="m" font-size="13.5" fill="#ffc24b">flux 7.2 × 10⁻²² W per m²</text></g><g class="r6"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">r = 15.0 billion km  ·  13.9 h of travel</text><text x="28" y="312" class="m" font-size="13.5" fill="#ffc24b">flux 5.0 × 10⁻²² W per m²</text></g><g class="r7"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">r = 17.5 billion km  ·  16.2 h of travel</text><text x="28" y="312" class="m" font-size="13.5" fill="#ffc24b">flux 3.7 × 10⁻²² W per m²</text></g><g class="r8"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">r = 20.0 billion km  ·  18.5 h of travel</text><text x="28" y="312" class="m" font-size="13.5" fill="#ffc24b">flux 2.8 × 10⁻²² W per m²</text></g><g class="r9"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">r = 22.5 billion km  ·  20.8 h of travel</text><text x="28" y="312" class="m" font-size="13.5" fill="#ffc24b">flux 2.2 × 10⁻²² W per m²</text></g><g class="r10"><text x="28" y="290" class="s" font-size="15" fill="#e9edff" font-weight="700">arrives after 23.2 h: 1.8 × 10⁻²² W per m²</text><text x="28" y="312" class="m" font-size="13.5" fill="#4ef0b8" font-weight="700">× 2,700 m² of dish = 4.9 × 10⁻¹⁹ W  (-153 dBm)</text></g><text x="540" y="272" class="s" font-size="11.5" fill="#5d6589">flux at the wavefront (log scale)</text><rect x="540" y="280" width="232" height="12" rx="6" fill="#161d36"/><g transform="translate(540 280)"><rect class="fb" wid