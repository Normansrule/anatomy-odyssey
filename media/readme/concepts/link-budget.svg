<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="ttl dsc"><title id="ttl">Deep-space link budget: Voyager to Earth</title><desc id="dsc">Animated link-budget diagram. A radio pulse leaves Voyager 1 and spreads as a sphere; as it travels 25 billion km (about 167 astronomical units, Voyager 1's distance in 2025) the readout steps through distance, light time and flux, and a log-scale bar falls. Flux S = P·G / (4πr²) with P = 22.4 W and high-gain antenna gain 48 dBi (×63,000): 5 billion km: 4.50e-21 W/m²; 10 billion km: 1.12e-21 W/m²; 15 billion km: 5.00e-22 W/m²; 20 billion km: 2.81e-22 W/m²; 25 billion km: 1.80e-22 W/m². Light time to 25 billion km = 23.2 hours. A 70 m Deep Space Network (DSN) antenna with about 2,700 m² effective area at 8.4 GHz collects 4.9e-19 W (-153 dBm), less than an attowatt, yet still decodes 160 bits per second. Sources: NASA JPL Voyager fact sheets; DSN Telecommunications Link Design Handbook (810-005).</desc><style>.s{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.smil,.still{}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}@keyframes wv{0%{transform:scale(.01);opacity:.9}100%{transform:scale(700);opacity:.15}}.w0{animation:wv 5s linear infinite}.w1{animation:wv 5s linear -1s infinite}.w2{animation:wv 5s linear -2s infinite}.w3{animation:wv 5s linear -3s infinite}.w4{animation:wv 5s linear -4s infinite}@keyframes pl{0%{transform:scale(.01);opacity:0}6%{transform:scale(.01);opacity:1}78%{transform:scale(660)}81%{transform:scale(690);opacity:0}100%{transform:scale(690);opacity:0}}.pl{animation:pl 14s linear infinite}@keyframes hit{0%{opacity:0}77.5%{opacity:0}78%{opacity:1}86%{opacity:0}100%{opacity:0}}.hit{animation:hit 14s linear infinite}.r0{opacity:0}@keyframes r0{0%{opacity: