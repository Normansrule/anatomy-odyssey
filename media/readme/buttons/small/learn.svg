<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 90" width="380" height="90" role="img" aria-labelledby="leat lead"><title id="leat">Start the Space Academy · Cosmic Library</title><desc id="lead">Button: Start the Space Academy (20 short lessons). The icon shows an open book whose page turns while a star pops out above it.</desc><style>*{transform-origin:0 0}.sans{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.serif{font-family:Georgia, "Times New Roman", Times, serif}@keyframes pg{0%{transform:scaleX(1)}15%{transform:scaleX(1)}45%{transform:scaleX(-1)}60%{transform:scaleX(-1)}60.01%{transform:scaleX(1)}100%{transform:scaleX(1)}}.pg{animation:pg 5s ease-in-out infinite}@keyframes st{0%{transform:translateY(6px) scale(.2);opacity:0}40%{transform:translateY(6px) scale(.2);opacity:0}55%{transform:translateY(-4px) scale(1.25);opacity:1}70%{transform:translateY(-2px) scale(1);opacity:1}92%{transform:translateY(-2px) scale(1);opacity:0}100%{transform:translateY(6px) scale(.2);opacity:0}}.st{animation:st 5s ease-out infinite}@keyframes sw{0%{transform:translateX(-160px)}62%{transform:translateX(-160px)}100%{transform:translateX(420px)}}.sw{animation:sw 6s cubic-bezier(.5,0,.3,1) infinite}@keyframes nu{0%{transform:translateX(0)}50%{transform:translateX(4px)}100%{transform:translateX(0)}}.nu{animation:nu 1.8s ease-in-out infinite}@keyframes rg{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.rg{animation:rg 24s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style><defs><clipPath id="cc"><rect x="3" y="3" width="374" height="79" rx="18"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101631"/><stop offset="1" stop-color="#060813"/></linearGradient><radialGradient id="gl" gradientUnits="userSp