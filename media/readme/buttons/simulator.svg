<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 120" width="560" height="120" role="img" aria-labelledby="simt simd"><title id="simt">Try the telescope simulator · Cosmic Library</title><desc id="simd">Button: Try the telescope simulator (see what a telescope really shows). The icon shows an eyepiece view of Saturn that drifts in and out of focus.</desc><style>*{transform-origin:0 0}.sans{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.serif{font-family:Georgia, "Times New Roman", Times, serif}@keyframes sh{0%{opacity:0}30%{opacity:0}45%{opacity:1}80%{opacity:1}92%{opacity:0}100%{opacity:0}}.shp{animation:sh 6s ease-in-out infinite}@keyframes kn{0%{transform:rotate(0)}30%{transform:rotate(0)}45%{transform:rotate(80deg)}80%{transform:rotate(80deg)}92%{transform:rotate(0)}100%{transform:rotate(0)}}.kn{animation:kn 6s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-160px)}62%{transform:translateX(-160px)}100%{transform:translateX(600px)}}.sw{animation:sw 6s cubic-bezier(.5,0,.3,1) infinite}@keyframes nu{0%{transform:translateX(0)}50%{transform:translateX(4px)}100%{transform:translateX(0)}}.nu{animation:nu 1.8s ease-in-out infinite}@keyframes rg{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.rg{animation:rg 24s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style><defs><clipPath id="cc"><rect x="4" y="4" width="552" height="106" rx="24"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101631"/><stop offset="1" stop-color="#060813"/></linearGradient><radialGradient id="gl" gradientUnits="userSpaceOnUse" cx="66" cy="57" r="252"><stop offset="0" stop-color="#ff4f9a" stop-opacity=".24"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></radialGradient><linearGradient id="b