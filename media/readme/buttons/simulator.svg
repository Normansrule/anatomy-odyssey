h="2.4"/><circle r="8" fill="url(#sat)"/><path d="M-15 0A15 4.6 0 0 0 15 0" transform="rotate(-16)" fill="none" stroke="#e8d7a8" stroke-width="2.4"/></g><g class="shp" style="opacity:1"><ellipse rx="15" ry="4.6" transform="rotate(-16)" fill="none" stroke="#e8d7a8" stroke-width="2.4"/><circle r="8" fill="url(#sat)"/><path d="M-15 0A15 4.6 0 0 0 15 0" transform="rotate(-16)" fill="none" stroke="#e8d7a8" stroke-width="2.4"/></g></g><circle r="24.5" fill="none" stroke="#ff4f9a" stroke-width="2.2"/><circle r="28.5" fill="none" stroke="#ff4f9a" stroke-opacity=".35" stroke-width="3"/><g transform="translate(21 21)"><circle r="6.5" fill="#1a2036" stroke="#ff4f9a" stroke-width="1.4"/><g class="kn"><path d="M0 -6.5V-2" stroke="#ff4f9a" stroke-width="1.6" stroke-linecap="round"/></g></g></g></g><text x="122" y="51" class="sans" font-size="23.5" font-weight="700" letter-spacing="-.2" fill="#e9edff">Try the telescope simulator</text><text x="122" y="79" class="sans" font-size="17.5" fill="#c3cae6" fill-opacity=".85">see what a telescope really shows</text><g transform="translate(516 57)"><circle r="20" fill="#ff4f9a" fill-opacity=".16" stroke="#ff4f9a" stroke-opacity=".7" stroke-width="1.4"/><g class="nu"><path d="M-7.6 0H7.6M1.6 -6L8 0L1.6 6" fill="none" stroke="#ff4f9a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
