<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 250" width="400" height="250" role="img" aria-labelledby="but bud"><title id="but">Rocket builder · Cosmic Library</title><desc id="bud">Rocket builder (Fly): Design a rocket, then fly it to orbit. Animated card: Rocket stages slide in and snap together on a blueprint grid, then a delta-v bar fills stage by stage past the 9.4 km/s needed for orbit.</desc><style>*{transform-origin:0 0}.sans{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.serif{font-family:Georgia, "Times New Roman", Times, serif}@keyframes tw{0%{opacity:1}50%{opacity:0.25}100%{opacity:1}}.t0{animation:tw 2.4s ease-in-out infinite}.t1{animation:tw 3.5s ease-in-out -0.73s infinite}.t2{animation:tw 4.6s ease-in-out -1.46s infinite}@keyframes s1{0%{transform:translateY(-220px);opacity:0}3%{transform:translateY(-220px);opacity:1;animation-timing-function:cubic-bezier(.25,1.4,.5,1)}13%{transform:translateY(0)}92%{transform:translateY(0);opacity:1}97%{transform:translateY(0);opacity:0}100%{transform:translateY(-220px);opacity:0}}.s1{animation:s1 9s linear infinite}@keyframes s2{0%{transform:translateY(-190px);opacity:0}13%{transform:translateY(-190px);opacity:1;animation-timing-function:cubic-bezier(.25,1.4,.5,1)}23%{transform:translateY(0)}92%{transform:translateY(0);opacity:1}97%{transform:translateY(0);opacity:0}100%{transform:translateY(-190px);opacity:0}}.s2{animation:s2 9s linear infinite}@keyframes k1{0%{transform:scale(.3);opacity:0}22%{transform:scale(.3);opacity:0}23%{opacity:.9}30%{transform:scale(1.6);opacity:0}100%{transform:scale(1.6);opacity:0}}.k1{animation:k1 9s ease-out infinite}@keyframes s3{0%{transform:translateY(-160px);opacity:0}23%{transform:translateY(-160px);opacity:1;animation-timing-function:cubic-bezier(.25,1.4,.5,1)}33%{transform:translateY(0)}92%{transform:translateY(0);opacity:1}97%{transform:translateY(0);opacity:0}100%{transform:translateY(-160px);opacity:0}}.s3{animation:s3 9s linear infinite}@keyframes k2{0%{transform:scale(.3);opacity:0}32%{transform:scale(.3);opacity:0}33%{opacity:.9}40%{transform:scale(1.6);opacity:0}100%{transform:scale(1.6);opacity:0}}.k2{animation:k2 9s ease-out infinite}@keyframes fr{0%{transform:translateY(-120px);opacity:0}33%{transform:translateY(-120px);opacity:1;animation-timing-function:cubic-bezier(.25,1.4,.5,1)}43%{transform:translateY(0)}92%{transform:translateY(0);opacity:1}97%{transform:translateY(0);opacity:0}100%{transform:translateY(-120px);opacity:0}}.fr{animation:fr 9s linear infinite}@keyframes k3{0%{transform:scale(.3);opacity:0}42%{transform:scale(.3);opacity:0}43%{opacity:.9}50%{transform:scale(1.6);opacity:0}100%{transform:scale(1.6);opacity:0}}.k3{animation:k3 9s ease-out infinite}@keyframes b0{0%{transform:scaleX(0);opacity:1}48%{transform:scaleX(0)}56%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}97%{opacity:0}100%{transform:scaleX(0);opacity:0}}.b0{animation:b0 9s ease-out infinite}@keyframes b1{0%{transform:scaleX(0);opacity:1}56%{transform:scaleX(0)}64%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}97%{opacity:0}100%{transform:scaleX(0);opacity:0}}.b1{animation:b1 9s ease-out infinite}@keyframes b2{0%{transform:scaleX(0);opacity:1}64%{transform:scaleX(0)}72%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}97%{opacity:0}100%{transform:scaleX(0);opacity:0}}.b2{animation:b2 9s ease-out infinite}@keyframes ro{0%{opacity:0.0}68%{opacity:0.0}72%{opacity:1.0}92%{opacity:1.0}96%{opacity:0.0}100%{opacity:0.0}}.ro{animation:ro 9s linear infinite}@keyframes gd{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-16}}.gd{animation:gd 2s linear infinite}@keyframes beam{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}.beam{animation:beam 9s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style><defs>