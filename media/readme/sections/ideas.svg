<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-labelledby="idet ided"><title id="idet">Ideas in motion · Cosmic Library</title><desc id="ided">Section banner: Ideas in motion. Animated Explanations. Every animation is drawn from real numbers. Animation: Equations drift in from all directions and assemble into a neat grid: the rocket equation, Kepler's third law T² ∝ a³, E = mc², Newton's gravity, the diffraction limit θ = 1.22 λ/D, circular orbital speed and redshift, then scatter again.</desc><style>*{transform-origin:0 0}.sans{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.serif{font-family:Georgia, "Times New Roman", Times, serif}@keyframes tw{0%{opacity:1}50%{opacity:0.25}100%{opacity:1}}.t0{animation:tw 2.6s ease-in-out infinite}.t1{animation:tw 3.7s ease-in-out -0.73s infinite}.t2{animation:tw 4.8s ease-in-out -1.46s infinite}@keyframes shm{0%{transform:translateX(0)}100%{transform:translateX(-1200px)}}.shm{animation:shm 12s linear infinite}@keyframes ebl{0%{transform:scaleX(.2)}50%{transform:scaleX(1)}100%{transform:scaleX(.2)}}.ebl{animation:ebl 6s ease-in-out infinite}@keyframes beam{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}.beam{animation:beam 12s linear infinite}@keyframes e0{0%{transform:translate(-105.3px,-63.2px) rotate(0deg) scale(0.7);opacity:0}5%{transform:translate(-105.3px,-63.2px) rotate(0deg) scale(0.7);opacity:0}12%{transform:translate(-37.7px,-24.6px) rotate(0deg) scale(0.85);opacity:.85}26%{transform:translate(0,0) rotate(0) scale(1);opacity:1}74%{transform:translate(0,0) rotate(0) scale(1);opacity:1}92%{transform:translate(-69.5px,-44px) rotate(0deg) scale(0.75);opacity:0}100%{transform:translate(-105.3px,-63.2px) rotate(0deg) scale(0.7);opacity:0}}.e0{animation:e0 10s cubic-bezier(.3,.7,.3,1) infinite}@keyfram